apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: hadoop-cluster
  labels:
    app: hive-metastore
    component: config
data:
  hive-site.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
        <property>
            <name>javax.jdo.option.ConnectionURL</name>
            <value>jdbc:postgresql://hive-metastore-db:5432/hive</value>
        </property>
        <property>
            <name>javax.jdo.option.ConnectionDriverName</name>
            <value>org.postgresql.Driver</value>
        </property>
        <property>
            <name>javax.jdo.option.ConnectionUserName</name>
            <value>hive</value>
        </property>
        <property>
            <name>javax.jdo.option.ConnectionPassword</name>
            <value>hive</value>
        </property>
        <property>
            <name>datanucleus.autoCreateSchema</name>
            <value>false</value>
        </property>
        <property>
            <name>hive.metastore.uris</name>
            <value>thrift://hive-metastore.hadoop-cluster.svc.cluster.local:9083</value>
        </property>
        <property>
            <name>hive.metastore.warehouse.dir</name>
            <value>hdfs://hadoop-hadoop-hdfs-nn:9000/user/hive/warehouse</value>
        </property>
        <property>
            <name>iceberg.catalog.hadoop.type</name>
            <value>hadoop</value>
        </property>
        <property>
            <name>iceberg.catalog.hadoop.warehouse</name>
            <value>hdfs://hadoop-hadoop-hdfs-nn:9000/user/hive/warehouse</value>
        </property>
        <property>
            <name>hive.exec.dynamic.partition</name>
            <value>true</value>
        </property>
        <property>
            <name>hive.exec.dynamic.partition.mode</name>
            <value>nonstrict</value>
        </property>
        <property>
            <name>hive.server2.thrift.port</name>
            <value>10000</value>
        </property>
        <property>
            <name>hive.server2.thrift.bind.host</name>
            <value>0.0.0.0</value>
        </property>
        <property>
            <name>hive.server2.transport.mode</name>
            <value>binary</value>
        </property>
        <property>
            <name>hive.server2.pid.file</name>
            <value>/opt/hive/tmp/hiveserver2.pid</value>
        </property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: hadoop-cluster
  labels:
    app: hive-metastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
        - name: init-schema
          image: lmphuc3012/hive:latest
          command: ["/bin/sh", "-c"]
          args:
            - export HIVE_CONF_DIR=/opt/hive/conf/ && schematool -dbType postgres -initSchema || echo "Schema already initialized"
          env:
            - name: HIVE_HOME
              value: /opt/hive
          volumeMounts:
            - name: config-volume
              mountPath: /opt/hive/conf/
      containers:
        - name: hive-metastore
          image: lmphuc3012/hive:latest
          command: ["/entrypoint.sh"]
          args: ["metastore"]
          ports:
            - containerPort: 9083
          env:
            - name: HIVE_HOME
              value: /opt/hive
          volumeMounts:
            - name: config-volume
              mountPath: /opt/hive/conf/
            - name: hive-tmp
              mountPath: /opt/hive/tmp/
      volumes:
        - name: config-volume
          configMap:
            name: hive-metastore-config
        - name: hive-tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-server2
  namespace: hadoop-cluster
  labels:
    app: hive-server2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-server2
  template:
    metadata:
      labels:
        app: hive-server2
    spec:
      containers:
        - name: hive-server2
          image: lmphuc3012/hive:latest
          command: ["/entrypoint.sh"]
          args: ["hiveserver2"]
          ports:
            - containerPort: 10000
          env:
            - name: HIVE_HOME
              value: /opt/hive
          volumeMounts:
            - name: config-volume
              mountPath: /opt/hive/conf/
            - name: hive-tmp
              mountPath: /opt/hive/tmp/
      volumes:
        - name: config-volume
          configMap:
            name: hive-metastore-config
        - name: hive-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hive-server2
  namespace: hadoop-cluster
spec:
  selector:
    app: hive-server2
  ports:
    - protocol: TCP
      port: 10000
      targetPort: 10000
