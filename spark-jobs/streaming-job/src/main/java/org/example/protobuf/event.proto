syntax = "proto3";

package org.example.proto;

message EventData {
  string event_time = 1;
  string event_date = 2;
  string event_time_only = 3;
  string event_type = 4;
  int64 product_id = 5;
  string category_id = 6;
  string category_code = 7;
  string brand = 8;
  float price = 9;
  int64 user_id = 10;
  string user_session = 11;
}
